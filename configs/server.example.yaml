# Protocol v2: upgrade both endpoints together. Compression is opt-in.
listen: ":4242"
psk: "REPLACE_WITH_BASE64_PSK"
alpn: "h3"
# Paths are relative to this configuration file. Generate once, keep stable.
cert_file: "cert.pem"
key_file: "key.pem"
allow_ephemeral_cert: false
compression: false
idle_timeout_sec: 60
handshake_timeout_sec: 10
request_timeout_sec: 15
max_connections: 256
max_streams_per_connection: 128
dns_timeout_sec: 5
dns_concurrency: 32
max_stream_recv_window_mb: 16
max_conn_recv_window_mb: 24
metrics_listen: "127.0.0.1:9101"
udp:
  max_flows: 256
  queue_size: 128
  workers: 4
  new_flows_per_second: 32
  max_payload: 850
  idle_timeout_sec: 60
# Optional ordinary HTTP/3 site. No indistinguishability guarantee.
decoy:
  mode: "off" # off | builtin | proxy | dir
  site_name: "CloudVault"
  upstream: ""
  dir: ""
# Empty allow lists allow all destinations. Deny applies to resolved IPs too.
# Set an explicit egress policy for the networks/services this server can reach.
acl:
  allow: []
  deny: []
  allow_ports: []
  deny_ports: []