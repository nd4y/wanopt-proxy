# Protocol v2: upgrade both endpoints together.
server: "your.server.example:4242"
psk: "REPLACE_WITH_BASE64_PSK"
pin: "REPLACE_WITH_SERVER_SPKI_PIN"
alpn: "h3"
socks_listen: "127.0.0.1:1080"
http_listen: "127.0.0.1:8080"
allow_remote_proxy: false
compression: false
disable_session_resumption: false
idle_timeout_sec: 60
handshake_timeout_sec: 10
request_timeout_sec: 15
max_pending_requests: 256
max_udp_sessions: 128
max_connections: 256
proxy_idle_timeout_sec: 300
http_response_header_timeout_sec: 120
max_header_bytes: 65536
max_stream_recv_window_mb: 16
max_conn_recv_window_mb: 24
metrics_listen: "127.0.0.1:9102"