name: CI
on:
  pull_request:
  push:
    branches: [main]
env:
  GOTOOLCHAIN: local
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - name: Verify complete test inventory and observation checks
        run: |
          python tools/validation/inventory.py --check
          python -m unittest discover -s tools/validation -v
      - name: All tests and complete executed subtest inventory
        shell: bash
        run: |
          set -o pipefail
          go test -json ./... -count=1 -timeout=3m | tee test-events.jsonl
      - name: Repeated HTTP informational response regression
        run: go test ./internal/proxy -run '^TestHTTPExpectContinueAndEarlyResponse/continue$' -count=1000 -timeout=2m
      - if: runner.os == 'Linux'
        run: go test -race ./... -count=1 -timeout=5m
      - if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - if: runner.os == 'Linux'
        run: |
          go test ./internal/protocol -run '^$' -fuzz '^FuzzAddress$' -fuzztime=10s -parallel=2
          go test ./internal/protocol -run '^$' -fuzz '^FuzzDatagram$' -fuzztime=10s -parallel=2
          go test ./internal/compress -run '^$' -fuzz '^FuzzDecopy$' -fuzztime=10s -parallel=2
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: test-events-${{ matrix.os }}
          path: test-events.jsonl
          retention-days: 14
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build release targets
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p bin
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o bin/wanopt-server-linux-amd64 ./cmd/server
          GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o bin/wanopt-client-windows-amd64.exe ./cmd/client
          go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o bin/wanopt-keygen ./cmd/keygen
      - name: Validate optional small-node Compose envelope
        run: docker compose -f docker-compose.yaml -f docker-compose.small.yaml config --quiet
      - run: docker build -t wanopt-server:ci .
      - name: Exercise nonroot read-only container and restart
        env:
          WANOPT_DOCKER_IMAGE: wanopt-server:ci
        run: go test ./internal/integration -run TestDockerImage -count=1 -timeout=60s
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: binaries
          path: bin/
          retention-days: 7
  experimental-bbr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Apply pinned patches, test both modules, and build BBR experiment
        env:
          WANOPT_EVENT_DIR: ${{ github.workspace }}/bbr-test-events
        run: bash experiments/bbr/build.sh "${RUNNER_TEMP}/wanopt-bbr-bin"
      - name: Namespace tools on the disposable runner
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends iproute2 ethtool
      - name: Actual BBR binaries and isolated impaired links
        # Only the disposable hosted runner is changed.
        run: sudo python3 tools/validation/check.py --bin "${RUNNER_TEMP}/wanopt-bbr-bin" --cc bbr --netem --report "${GITHUB_WORKSPACE}/bbr-e2e.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: bbr-e2e
          path: |
            bbr-e2e.json
            bbr-test-events/
          retention-days: 14
  binary-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build actual runtime binaries
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p validation-bin
          ext=''
          if [[ '${{ runner.os }}' == Windows ]]; then ext='.exe'; fi
          for target in client server keygen; do go build -trimpath -buildvcs=false -o "validation-bin/wanopt-${target}${ext}" "./cmd/${target}"; done
          go build -trimpath -buildvcs=false -o "validation-bin/wanbench${ext}" ./tools/wanbench
      - name: Actual binary end-to-end checks
        run: python tools/validation/check.py --bin validation-bin --report binary-e2e.json
      - name: Failure teardown keeps no process or credential directory
        shell: bash
        run: |
          if python tools/validation/check.py --bin validation-bin --fail-after-ready --report failure-e2e.json; then exit 1; fi
          python -c "import json; r=json.load(open('failure-e2e.json')); assert r['error']=='intentional harness failure probe' and r['cleanup_passed'] and r['runtime_removed'] and not r['owned_processes_remaining']"
      - name: Isolated synthetic impaired links
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iproute2 ethtool
          sudo python3 tools/validation/check.py --bin validation-bin --netem --report netem-e2e.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: binary-e2e-${{ matrix.os }}
          path: '*e2e.json'
          retention-days: 14
